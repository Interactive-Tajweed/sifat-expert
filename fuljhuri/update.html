<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ফুলঝুড়ি গেম ডাউনলোড</title>
  <style>
    * { box-sizing: border-box }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #091528;
      color: #fff5df;
      font: 17px/1.6 system-ui, sans-serif;
    }
    main {
      width: min(100%, 430px);
      padding: 24px;
      background: #14243b;
      border: 1px solid #a78a56;
      border-radius: 18px;
    }
    h1 { margin: 0; font-size: 25px }
    p { margin: 10px 0 18px }
    a {
      display: block;
      margin-top: 12px;
      padding: 13px;
      border-radius: 10px;
      background: #f4d79a;
      color: #17263a;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>সিফাতের ফুলঝুড়ি</h1>
    <p id="status" role="status">গেমের ফাইল তৈরি হচ্ছে…</p>
    <div id="files"></div>
  </main>

  <script>
    const names = {
      bn: 'সিফাতের ফুলঝুড়ি',
      en: 'Sifat Flower Basket'
    };

    // এই অংশটি তৈরি করা গেমের ভিতরে চলবে।
    function applyGameNames(names) {
      function refresh() {
        const lang = document.documentElement.lang === 'en' ? 'en' : 'bn';
        const screenName = names[lang];
        document.title = 'Tajweed Game | ' + screenName;

        for (const heading of document.querySelectorAll('#stage h1, #exitPage h1')) {
          if (heading.textContent !== screenName) {
            heading.textContent = screenName;
          }
        }
      }

      refresh();

      new MutationObserver(refresh).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['lang']
      });

      const switcher = document.getElementById('language');
      if (switcher) {
        switcher.addEventListener('click', () => queueMicrotask(refresh));
      }
    }

    async function prepareFile(filename, lang) {
      const response = await fetch('./' + filename, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(filename + ' পাওয়া যায়নি।');
      }

      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');

      if (!doc.querySelector('#stage h1') || !doc.querySelector('#language')) {
        throw new Error(filename + ' ফাইলে ফুলঝুড়ি গেমটি পাওয়া যায়নি।');
      }

      const screenName = names[lang];
      const searchTitle = 'Tajweed Game | ' + screenName;

      doc.documentElement.lang = lang;
      doc.title = searchTitle;

      for (const heading of doc.querySelectorAll('#stage h1, #exitPage h1')) {
        heading.textContent = screenName;
        if (heading.hasAttribute('data-bn')) {
          heading.setAttribute('data-bn', names.bn);
        }
      }

      let shareTitle = doc.querySelector('meta[property="og:title"]');
      if (!shareTitle) {
        shareTitle = doc.createElement('meta');
        shareTitle.setAttribute('property', 'og:title');
        doc.head.append(shareTitle);
      }
      shareTitle.setAttribute('content', searchTitle);

      // বারবার আপডেট করলেও একই কোড একবারই থাকবে।
      doc.getElementById('fuljhuri-screen-names')?.remove();

      const script = doc.createElement('script');
      script.id = 'fuljhuri-screen-names';
      script.textContent =
        '(' + applyGameNames.toString() + ')(' + JSON.stringify(names) + ');';
      doc.body.append(script);

      const output = '<!doctype html>\n' + doc.documentElement.outerHTML;
      const blob = new Blob([output], { type: 'text/html;charset=utf-8' });

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.textContent = lang === 'bn'
        ? '⬇ বাংলা গেম ডাউনলোড — index.html'
        : '⬇ English game download — en.html';

      return link;
    }

    async function prepareDownloads() {
      const status = document.getElementById('status');
      const files = document.getElementById('files');

      try {
        const links = await Promise.all([
          prepareFile('index.html', 'bn'),
          prepareFile('en.html', 'en')
        ]);

        files.replaceChildren(...links);
        status.textContent = 'দুটি ফাইল তৈরি হয়েছে। নিচের বোতাম দুটি চাপুন।';
      } catch (error) {
        status.textContent = 'ফাইল তৈরি করা যায়নি। ' + error.message;
      }
    }

    prepareDownloads();
  </script>
</body>
</html>
