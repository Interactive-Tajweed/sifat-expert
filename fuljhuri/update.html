<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ফুলঝুড়ি গেমের ফাইল ডাউনলোড</title>
  <style>
    * { box-sizing: border-box }
    body {
      margin: 0; padding: 24px; min-height: 100svh;
      display: grid; place-items: center;
      background: #091528; color: #fff5df;
      font: 17px/1.6 system-ui, sans-serif;
    }
    main {
      width: min(100%, 440px); padding: 24px;
      background: #14243b; border: 1px solid #997b50;
      border-radius: 18px;
    }
    h1 { margin: 0; font-size: 24px }
    a {
      display: block; margin-top: 12px; padding: 12px;
      border-radius: 10px; text-align: center;
      background: #f4d79a; color: #192436;
      text-decoration: none; font-weight: bold;
    }
    [hidden] { display: none }
  </style>
</head>
<body>
  <main>
    <h1>ফুলঝুড়ি গেমের ফাইল</h1>
    <p id="status" role="status">গেমের ফাইল তৈরি হচ্ছে…</p>
    <div id="downloads" hidden></div>
  </main>

  <script>
    const statusText = document.querySelector('#status');
    const downloads = document.querySelector('#downloads');
    const folder = new URL('./', location.href);
    const titles = {
      bn: 'Tajweed Game | সিফাতের ফুলঝুড়ি',
      en: 'Tajweed Game | Sifat Flower Basket'
    };

    function makePage(source, lang) {
      const doc = new DOMParser().parseFromString(source, 'text/html');
      const stage = doc.querySelector('#stage');
      const paired = doc.querySelector('#a')?.closest('aside');
      const unpaired = doc.querySelector('#b')?.closest('aside');

      if (!stage || !paired || !unpaired || !doc.querySelector('#language')) {
        throw new Error('ফুলঝুড়ির গেমটি চেনা যায়নি। update.html ফাইলটি fuljhuri ফোল্ডারে আছে কি না দেখুন।');
      }

      // মুতাদ্দদাহ বামে, গইরে মুতাদ্দদাহ ডানে।
      stage.before(paired);
      stage.after(unpaired);

      doc.documentElement.lang = lang;
      doc.title = titles[lang];

      const description = lang === 'en'
        ? 'Learn the traits of Arabic letters in a free Tajweed game. Choose the correct sifat and fill your flower basket.'
        : 'আরবি হরফের সঠিক সিফাত বেছে ফুলের ঝুড়িতে রাখুন। বাংলা ও ইংরেজিতে তাজবীদ অনুশীলন করুন।';

      function meta(attr, key, value) {
        let tag = doc.head.querySelector(`meta[${attr}="${key}"]`);
        if (!tag) {
          tag = doc.createElement('meta');
          tag.setAttribute(attr, key);
          doc.head.append(tag);
        }
        tag.content = value;
      }

      meta('name', 'description', description);
      meta('property', 'og:title', titles[lang]);
      meta('property', 'og:description', description);

      doc.head.querySelectorAll(
        'link[rel="canonical"], link[rel="alternate"][hreflang]'
      ).forEach(link => link.remove());

      function addLink(rel, file, language) {
        const link = doc.createElement('link');
        link.rel = rel;
        link.href = new URL(file, folder).href;
        if (language) link.hreflang = language;
        doc.head.append(link);
      }

      addLink('canonical', lang === 'en' ? 'en.html' : './');
      addLink('alternate', './', 'bn');
      addLink('alternate', 'en.html', 'en');
      addLink('alternate', './', 'x-default');

      doc.querySelector('#fuljhuri-spacing')?.remove();
      const style = doc.createElement('style');
      style.id = 'fuljhuri-spacing';
      style.textContent = `
        main aside:first-of-type h2 {
          margin: 0 0 4px;
          padding: 0 0 0 28px;
        }
        #a {
          padding: 0;
          align-content: stretch;
          align-items: stretch;
          row-gap: 4px;
        }
        #a .tile { align-self: stretch }
        main aside:last-of-type h2 { padding-right: 28px }
      `;
      doc.head.append(style);

      // পুরোনো গেমের নিজস্ব ভাষা বদলের বোতাম ব্যবহার করে
      // অক্ষর, সিফাত, নোট এবং খেলার নির্দেশনা একসঙ্গে বদলায়।
      doc.querySelector('#fuljhuri-entry')?.remove();
      const init = doc.createElement('script');
      init.id = 'fuljhuri-entry';
      init.textContent = `
        (() => {
          const wanted = ${JSON.stringify(lang)};
          const names = ${JSON.stringify(titles)};
          const button = document.getElementById('language');

          function syncTitle() {
            const active = document.documentElement.lang === 'en' ? 'en' : 'bn';
            document.title = names[active];
            for (const heading of document.querySelectorAll('#stage h1, #exitPage h1')) {
              if (heading.textContent !== names[active]) heading.textContent = names[active];
            }
          }

          if (button && document.documentElement.lang !== wanted) button.click();
          syncTitle();
          button?.addEventListener('click', () => {
            syncTitle();
            const file = document.documentElement.lang === 'en' ? 'en.html' : './';
            if (location.protocol.startsWith('http')) history.replaceState(null, '', file);
          });
        })();
      `;
      doc.body.append(init);
      return '<!doctype html>\n' + doc.documentElement.outerHTML;
    }

    async function prepare() {
      try {
        const response = await fetch(new URL('index.html', folder), {
          cache: 'no-store'
        });
        if (!response.ok) throw new Error('গেমের index.html পাওয়া যায়নি।');

        const source = await response.text();
        for (const [lang, file, label] of [
          ['bn', 'index.html', '⬇ বাংলা ফাইল ডাউনলোড'],
          ['en', 'en.html', '⬇ ইংরেজি ফাইল ডাউনলোড']
        ]) {
          const html = makePage(source, lang);
          const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = file;
          link.textContent = label;
          downloads.append(link);
        }

        statusText.textContent = 'ফাইল তৈরি হয়েছে। নিচের দুটি বোতামে আলাদা করে চাপুন।';
        downloads.hidden = false;
      } catch (error) {
        statusText.textContent = 'ফাইল তৈরি করা যায়নি। ' + error.message;
      }
    }

    prepare();
  </script>
</body>
</html>
